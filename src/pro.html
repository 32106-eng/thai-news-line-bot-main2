<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>สมัคร Pro — ยายจันทร์</title>
<style>
  @font-face{font-family:"Noto Sans Thai";font-display:swap}
  :root{
    --paper:#F6F3EE;--card:#FFFDFA;--ink:#231F1A;--ink-soft:#8A8078;--line:#E4DDD2;--line-soft:#EEE8DE;
    --wine:#7A2B3D;--wine-deep:#5C1F2D;--wine-soft:#F3E5E6;
    --gold:#A6772E;--gold-soft:#F5ECD9;--gold-deep:#7A5820;
    --sage:#4B6A58;--sage-soft:#E7EFE8;
    --radius:18px;--radius-sm:12px;
    --shadow:0 1px 2px rgba(35,31,26,.05),0 10px 28px -14px rgba(35,31,26,.16);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans Thai",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  .app{max-width:480px;margin:auto;min-height:100vh;padding:0 0 40px;position:relative}
  img{max-width:100%}

  /* ---- top bar ---- */
  .top{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;padding:16px 18px 10px;background:linear-gradient(var(--paper) 65%,transparent)}
  .back{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--ink);flex:none;transition:transform .12s,background .15s}
  .back:active{transform:scale(.9);background:var(--wine-soft)}
  .top span{font-size:13px;font-weight:800;color:var(--ink-soft)}

  /* ---- hero: seal + headline ---- */
  .hero{padding:8px 24px 26px;text-align:center}
  .seal-wrap{display:flex;justify-content:center;margin-bottom:18px}
  .seal{width:64px;height:64px;border-radius:50%;background:var(--wine);color:#fff;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:800;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 12px 26px -10px rgba(122,43,61,.5);position:relative}
  .seal::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px dashed var(--gold);opacity:.55;animation:spin-slow 26s linear infinite}
  @keyframes spin-slow{to{transform:rotate(360deg)}}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);margin:0 0 8px}
  .hero h1{font-size:25px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px;line-height:1.25}
  .hero h1 em{font-style:normal;color:var(--wine)}
  .hero p{font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin:0 auto;max-width:320px}

  /* ---- signature element: before/after receipt slips ---- */
  .compare{padding:6px 20px 8px;display:flex;justify-content:center;gap:14px;align-items:flex-end}
  .slip{width:132px;border-radius:12px;background:#fff;box-shadow:0 10px 24px -12px rgba(35,31,26,.28);padding:12px 12px 14px;position:relative;transform:rotate(var(--tilt,0deg))}
  .slip.free{--tilt:-3deg;opacity:.72;transform-origin:bottom left}
  .slip.pro{--tilt:2.5deg;transform-origin:bottom right;box-shadow:0 16px 32px -12px rgba(122,43,61,.35);border:1px solid var(--gold-soft)}
  .slip-tag{font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
  .slip.pro .slip-tag{color:var(--gold-deep)}
  .slip-line{height:6px;border-radius:3px;background:var(--line-soft);margin-bottom:6px}
  .slip-line.short{width:60%}
  .slip.pro .slip-line{background:var(--gold-soft)}
  .slip-badge{position:absolute;top:-9px;right:-8px;background:var(--gold);color:#3A2C0F;font-size:8.5px;font-weight:800;padding:3px 8px;border-radius:99px;box-shadow:0 4px 10px -3px rgba(166,119,46,.6)}
  .slip-amt{font-size:15px;font-weight:800;margin-top:8px;color:var(--wine)}
  .slip-check{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--sage);margin-top:6px;font-weight:700}
  .compare-arrow{font-size:16px;color:var(--ink-soft);padding-bottom:22px}

  /* ---- sections ---- */
  .section{padding:26px 20px 0}
  .section-title{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);margin:0 4px 12px;display:flex;align-items:center;gap:8px}
  .section-title::after{content:"";flex:1;height:1px;background:var(--line)}

  /* ---- feature ledger ---- */
  .ledger{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .entry{display:flex;gap:13px;padding:15px 16px;align-items:flex-start}
  .entry+.entry{border-top:1px dashed var(--line-soft)}
  .entry-stamp{width:36px;height:36px;border-radius:10px;background:var(--wine-soft);color:var(--wine);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
  .entry-text strong{display:block;font-size:13.5px;font-weight:700;margin-bottom:2px}
  .entry-text span{display:block;font-size:12px;color:var(--ink-soft);line-height:1.5}

  /* ---- price card ---- */
  .price-card{margin:26px 20px 0;border-radius:var(--radius);background:linear-gradient(155deg,var(--wine) 0%,var(--wine-deep) 100%);color:#fff;padding:22px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
  .price-card::before{content:"";position:absolute;top:-40px;right:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07)}
  .price-card::after{content:"";position:absolute;bottom:-50px;left:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.05)}
  .price-row{display:flex;align-items:baseline;gap:6px;position:relative}
  .price-amt{font-size:34px;font-weight:800;letter-spacing:-.02em}
  .price-unit{font-size:13px;color:#f0d3da}
  .price-note{font-size:12px;color:#f0d3da;margin-top:6px;line-height:1.6;position:relative}

  /* ---- notices / loading ---- */
  .notice{margin:16px 20px 0;padding:14px 16px;border-radius:var(--radius-sm);background:var(--wine-soft);color:var(--wine-deep);font-size:12.5px;line-height:1.6}
  .notice.error{background:#FBEAEA;color:#7A2B3D}
  .notice.sage{background:var(--sage-soft);color:#33493C}

  /* ---- checkout ---- */
  .checkout{padding:22px 20px 0}
  .qr-frame{display:flex;justify-content:center;padding:20px 0 6px}
  .qr-frame img{border-radius:16px;border:1px solid var(--line);background:#fff;padding:12px;box-shadow:var(--shadow)}
  .qr-meta{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;font-size:12.5px;line-height:2;color:var(--ink-soft)}
  .qr-meta strong{color:var(--ink);font-weight:800}
  .qr-meta .row{display:flex;justify-content:space-between}
  .upload-box{margin-top:16px;border:1.5px dashed var(--line);border-radius:var(--radius-sm);padding:18px;text-align:center;background:var(--card);transition:border-color .15s,background .15s;position:relative}
  .upload-box.has-file{border-color:var(--sage);background:var(--sage-soft)}
  .upload-box input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
  .upload-box .up-icon{font-size:24px;margin-bottom:6px}
  .upload-box .up-label{font-size:12.5px;font-weight:700;color:var(--ink)}
  .upload-box .up-sub{font-size:11px;color:var(--ink-soft);margin-top:3px}

  button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .primary{width:100%;border:0;border-radius:var(--radius-sm);padding:15px;font-size:14.5px;font-weight:800;color:#fff;background:var(--wine);box-shadow:0 10px 22px -10px rgba(122,43,61,.55);transition:transform .12s,opacity .15s}
  .primary:active{transform:scale(.98)}
  .primary:disabled{opacity:.55;box-shadow:none}
  .primary.sage{background:var(--sage);box-shadow:0 10px 22px -10px rgba(75,106,88,.5)}
  .secondary{width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;font-size:13.5px;font-weight:700;color:var(--ink);background:var(--card)}
  .secondary:active{transform:scale(.98)}

  .actionbar{padding:22px 20px 0}
  .skel{background:linear-gradient(100deg,var(--line-soft) 30%,#faf6ef 50%,var(--line-soft) 70%);background-size:200% 100%;animation:shimmer 1.3s ease infinite;border-radius:8px}
  @keyframes shimmer{to{background-position:-200% 0}}
  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;display:inline-block;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:7px}
  @keyframes spin{to{transform:rotate(360deg)}}

  .hidden{display:none!important}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:0 10px 24px -8px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .fade-in{animation:fade-in .4s cubic-bezier(.22,1,.36,1) both}
  @keyframes fade-in{from{opacity:0;transform:translateY(6px)}}

  @media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="back" id="backBtn" aria-label="กลับ">‹</button>
    <span id="topLabel">สมัคร Pro</span>
  </header>

  <div id="root">
    <div class="hero"><div class="skel" style="height:180px;border-radius:18px;margin:0 20px"></div></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const uid = params.get('u');
  const query = '?token=' + encodeURIComponent(token || '') + '&u=' + encodeURIComponent(uid || '');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = n => new Intl.NumberFormat('th-TH', { maximumFractionDigits: 2 }).format(Number(n) || 0);
  const fmtExpiry = iso => { if (!iso) return null; try { return new Date(iso).toLocaleDateString('th-TH', { day:'numeric', month:'long', year:'numeric' }); } catch { return null; } };

  const FEATURES = [
    { icon:'📸', title:'อ่านใบเสร็จอัตโนมัติ', sub:'ถ่ายรูปสลิปส่งมา ยายจันทร์อ่านยอดเงินกับร้านค้าให้เอง ไม่ต้องพิมพ์เอง' },
    { icon:'👥', title:'จดบัญชีกลุ่ม', sub:'ชวนยายจันทร์เข้ากลุ่ม จดกองกลางร่วมกับเพื่อนหรือครอบครัวได้' },
    { icon:'🚫', title:'ไม่มีโฆษณาคั่น', sub:'กดเข้าแดชบอร์ดได้ทันที ไม่ต้องรอดูโฆษณาก่อน' },
    { icon:'⏰', title:'เตือนจดประจำวัน', sub:'ตั้งเวลาที่อยากให้ยายจันทร์ทักให้เอง ไม่พลาดทุกวัน' },
    { icon:'📄', title:'รายงาน PDF', sub:'สรุปรายเดือน/รายปีพร้อมกราฟ เก็บไว้ยื่นภาษีหรือส่งนักบัญชีได้เลย' },
    { icon:'🎨', title:'ปรับแต่งการ์ดจดสำเร็จ', sub:'เลือกธีมสี ซ่อน/โชว์ปุ่มต่าง ๆ ให้เข้ากับสไตล์ของคุณ' },
    { icon:'✨', title:'จดจำหมวดหมู่', sub:'พิมพ์ชื่อรายการที่เคยจด ยายจันทร์เติมหมวดให้อัตโนมัติ' }
  ];

  let subscription = { active:false, expiresAt:null, plan:'FREE', lineOaLink:null };
  let allowedFlag = false;
  let checkoutSession = null;

  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2200);
  }

  async function api(url, opt){
    const r = await fetch(url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token || '') + '&u=' + encodeURIComponent(uid || ''), opt);
    if (!r.ok) { const body = await r.json().catch(() => ({})); throw new Error(body.error || 'ทำรายการไม่สำเร็จ'); }
    return r.json();
  }

  function renderFeatureLedger(){
    return `<div class="ledger">${FEATURES.map(f => `
      <div class="entry">
        <div class="entry-stamp">${f.icon}</div>
        <div class="entry-text"><strong>${esc(f.title)}</strong><span>${esc(f.sub)}</span></div>
      </div>`).join('')}</div>`;
  }

  function renderActivePage(){
    const expiry = fmtExpiry(subscription.expiresAt);
    document.getElementById('topLabel').textContent = 'สมาชิก Pro';
    document.getElementById('root').innerHTML = `
      <div class="hero fade-in">
        <div class="seal-wrap"><div class="seal">จ</div></div>
        <p class="eyebrow">ขอบคุณนะ</p>
        <h1>คุณเป็น <em>Pro</em> อยู่แล้ว</h1>
        <p>${expiry ? `ใช้งานได้ถึง ${esc(expiry)} — ยายจันทร์จะดูแลบัญชีให้เต็มที่ต่อไปนะ` : 'ยายจันทร์ดีใจที่ได้ดูแลบัญชีให้เต็มรูปแบบนะ'}</p>
      </div>
      <div class="section">
        <div class="section-title">สิทธิ์ที่ได้ใช้อยู่ตอนนี้</div>
        ${renderFeatureLedger()}
      </div>
      <div class="actionbar" style="padding-bottom:8px">
        <button class="secondary" id="renewBtn">ต่ออายุ / ดูรายละเอียดการชำระเงิน</button>
      </div>
    `;
    document.getElementById('renewBtn').onclick = startCheckout;
  }

  function renderUpsellPage(){
    document.getElementById('topLabel').textContent = 'สมัคร Pro';
    document.getElementById('root').innerHTML = `
      <div class="hero fade-in">
        <div class="seal-wrap"><div class="seal">จ</div></div>
        <p class="eyebrow">ยายจันทร์ Pro</p>
        <h1>ให้ยายจันทร์ดูแล<br>บัญชีให้ <em>เต็มที่</em></h1>
        <p>ปลดล็อกลูกเล่นที่ช่วยให้จดง่ายขึ้น เร็วขึ้น และดูภาพรวมการเงินได้ชัดเจนขึ้น</p>
      </div>

      <div class="compare fade-in" style="animation-delay:.05s">
        <div class="slip free">
          <div class="slip-tag">ฟรี</div>
          <div class="slip-line"></div>
          <div class="slip-line short"></div>
          <div class="slip-amt" style="color:var(--ink-soft)">พิมพ์เอง</div>
        </div>
        <div class="compare-arrow">→</div>
        <div class="slip pro">
          <div class="slip-badge">PRO</div>
          <div class="slip-tag">ถ่ายรูปสลิป</div>
          <div class="slip-line"></div>
          <div class="slip-line short"></div>
          <div class="slip-amt">อ่านให้อัตโนมัติ</div>
          <div class="slip-check">✓ ยายจันทร์อ่านให้เสร็จ</div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Pro ทำอะไรให้ได้บ้าง</div>
        ${renderFeatureLedger()}
      </div>

      <div class="price-card fade-in" style="animation-delay:.1s">
        <div class="price-row"><span class="price-amt num">฿${money(checkoutSession?.amount ?? 50)}</span><span class="price-unit">/ เดือน</span></div>
        <p class="price-note">จ่ายผ่าน PromptPay ครั้งเดียวต่อเดือน ยกเลิกเมื่อไหร่ก็ได้ ไม่ผูกมัด</p>
      </div>

      <div class="actionbar">
        <button class="primary" id="startCheckoutBtn">สมัคร Pro เลย</button>
      </div>
    `;
    document.getElementById('startCheckoutBtn').onclick = startCheckout;
  }

  async function startCheckout(){
    const root = document.getElementById('root');
    root.innerHTML = `<div class="hero"><div class="seal-wrap"><div class="seal">จ</div></div><p style="color:var(--ink-soft);font-size:13px">กำลังสร้างรายการชำระเงิน…</p></div>`;
    try {
      const res = await api('/api/premium/checkout', { method:'POST' });
      if (res.alreadyPremium) {
        subscription.active = true;
        subscription.expiresAt = res.expiresAt;
        renderActivePage();
        return;
      }
      checkoutSession = res;
      renderCheckout();
    } catch (e) {
      renderCheckoutError(e.message);
    }
  }

  function renderCheckoutError(msg){
    document.getElementById('root').innerHTML = `
      <div class="hero"><div class="seal-wrap"><div class="seal">จ</div></div><h1 style="font-size:18px">สร้างรายการไม่สำเร็จ</h1></div>
      <div class="notice error">${esc(msg || 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง')}</div>
      <div class="actionbar">
        <button class="primary" id="retryBtn">ลองอีกครั้ง</button>
        ${subscription.lineOaLink ? '<div style="height:10px"></div><button class="secondary" id="lineFallbackBtn">เปิดแชท LINE แทน</button>' : ''}
      </div>
    `;
    document.getElementById('retryBtn').onclick = startCheckout;
    const fb = document.getElementById('lineFallbackBtn');
    if (fb) fb.onclick = () => window.open(subscription.lineOaLink, '_blank');
  }

  function renderCheckout(){
    const s = checkoutSession;
    document.getElementById('topLabel').textContent = 'ชำระเงิน';
    document.getElementById('root').innerHTML = `
      <div class="checkout fade-in">
        <div style="text-align:center">
          <p class="eyebrow" style="margin-bottom:4px">สแกนจ่ายผ่าน PromptPay</p>
        </div>
        <div class="qr-frame"><img src="${esc(s.qrImageUrl + query)}" alt="PromptPay QR" width="220" height="220"></div>
        <div class="qr-meta">
          <div class="row"><span>จำนวนเงิน</span><strong class="num">${money(s.amount)} บาท</strong></div>
          <div class="row"><span>เลขอ้างอิง</span><strong>${esc(s.referenceId)}</strong></div>
          <div class="row"><span>หมดอายุ</span><strong>${esc(fmtExpiry(s.expiresAt) || '-')}</strong></div>
        </div>

        <label class="upload-box" id="uploadBox">
          <input type="file" id="slipInput" accept="image/*">
          <div class="up-icon">🧾</div>
          <div class="up-label" id="uploadLabel">แตะเพื่ออัปโหลดรูปสลิป</div>
          <div class="up-sub" id="uploadSub">หลังโอนเงินแล้ว ถ่ายรูปสลิปส่งมาตรวจสอบ</div>
        </label>

        <div id="slipStatus"></div>
      </div>
      <div class="actionbar">
        <button class="primary" id="slipSubmit" disabled>ส่งสลิปเพื่อตรวจสอบ</button>
      </div>
    `;
    const fileInput = document.getElementById('slipInput');
    const uploadBox = document.getElementById('uploadBox');
    const submitBtn = document.getElementById('slipSubmit');
    const statusEl = document.getElementById('slipStatus');
    let picked = null;

    fileInput.onchange = () => {
      picked = fileInput.files[0] || null;
      submitBtn.disabled = !picked;
      uploadBox.classList.toggle('has-file', !!picked);
      document.getElementById('uploadLabel').textContent = picked ? picked.name : 'แตะเพื่ออัปโหลดรูปสลิป';
      document.getElementById('uploadSub').textContent = picked ? 'แตะเพื่อเลือกรูปอื่น' : 'หลังโอนเงินแล้ว ถ่ายรูปสลิปส่งมาตรวจสอบ';
    };

    submitBtn.onclick = async () => {
      if (!picked) return;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>กำลังส่ง…';
      statusEl.innerHTML = '';
      try {
        const base64 = await fileToBase64(picked);
        const result = await api('/api/premium/slip', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ sessionId: s.sessionId, mime: picked.type, base64 })
        });
        const tone = result.outcome === 'VERIFIED' ? 'sage' : (result.outcome === 'REJECTED' || result.outcome === 'DUPLICATE' ? 'error' : '');
        statusEl.innerHTML = `<div class="notice ${tone}">${esc(result.message)}</div>`;
        toast(result.message);
        if (result.outcome === 'VERIFIED' || result.outcome === 'PENDING_REVIEW') {
          checkoutSession = null;
          setTimeout(load, 1400);
        } else {
          submitBtn.disabled = false;
          submitBtn.textContent = 'ส่งสลิปเพื่อตรวจสอบ';
        }
      } catch (e) {
        statusEl.innerHTML = `<div class="notice error">${esc(e.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง')}</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = 'ส่งสลิปเพื่อตรวจสอบ';
      }
    };
  }

  function fileToBase64(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
      reader.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('backBtn').onclick = () => {
    if (checkoutSession) {
      checkoutSession = null;
      load();
      return;
    }
    if (document.referrer) history.back();
    else location.href = '/dashboard' + query;
  };

  async function load(){
    try {
      subscription = await api('/api/subscription');
      allowedFlag = true;
      if (subscription.active) renderActivePage();
      else renderUpsellPage();
    } catch (e) {
      allowedFlag = false;
      document.getElementById('root').innerHTML = `<div class="notice error">เข้าถึงหน้านี้ไม่ได้ ลิงก์อาจหมดอายุ กรุณาเปิดใหม่จากเมนู "เว็บ" ในแชท</div>`;
    }
  }

  load();
</script>
</body>
</html>
