<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ยายจันทร์ Premium — Admin</title>
<style>
  :root{
    --pink:#d23283; --pink-dark:#a4256a; --white:#fff; --dark:#222222;
    --light-pink:#fceaf4; --grey:#6b6b76; --line:#ece5ea;
    --ok:#1f9d55; --warn:#d99a2b; --danger:#d23232;
    --font: 'Segoe UI', -apple-system, "Noto Sans Thai", sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);background:var(--light-pink);color:var(--dark);}
  header{background:var(--white);border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
  header h1{font-size:17px;margin:0;color:var(--pink-dark);letter-spacing:.2px}
  header .badge{font-size:11px;background:var(--light-pink);color:var(--pink-dark);padding:3px 10px;border-radius:99px;margin-left:8px;font-weight:600}
  #logout{border:none;background:transparent;color:var(--grey);font-size:13px;cursor:pointer}
  main{max-width:1080px;margin:0 auto;padding:24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:28px}
  .card{background:var(--white);border-radius:14px;padding:16px 18px;border:1px solid var(--line)}
  .card .num{font-size:26px;font-weight:700;color:var(--dark)}
  .card .label{font-size:12.5px;color:var(--grey);margin-top:2px}
  .card.pink .num{color:var(--pink)}
  section{margin-bottom:32px}
  section h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--grey);margin:0 0 12px;display:flex;align-items:center;gap:8px}
  section h2 .count{background:var(--light-pink);color:var(--pink-dark);font-size:11px;padding:2px 8px;border-radius:99px;text-transform:none;letter-spacing:0}
  .review{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .review .meta{font-size:13px;color:var(--grey);line-height:1.7}
  .review .ref{font-weight:700;color:var(--pink-dark);font-size:14px}
  .review .amount{font-weight:700;font-size:15px}
  /* เทียบชื่อเจ้าของบัญชี (LINE) กับชื่อผู้โอนที่อ่านได้จากสลิป — จุดสำคัญที่สุดของการตรวจสอบ ต้องเด่นกว่าข้อมูลอื่นในการ์ด */
  .namecheck{background:#fafafa;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px}
  .namecheck .row{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
  .namecheck .row b{color:var(--dark)}
  .namecheck.mismatch{background:#fdecec;border-color:var(--danger)}
  .namecheck.mismatch .row b{color:var(--danger)}
  .namecheck .flag{display:inline-flex;align-items:center;gap:5px;color:var(--danger);font-weight:700;font-size:12px;margin-top:4px}
  .namecheck .ok{display:inline-flex;align-items:center;gap:5px;color:var(--ok);font-weight:700;font-size:12px;margin-top:4px}
  .review .slip-link{font-size:12.5px;color:var(--pink-dark);text-decoration:none;font-weight:600}
  .review .slip-link:hover{text-decoration:underline}
  .actions{display:flex;gap:8px}
  button.approve, button.reject{border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
  button.approve{background:var(--pink);color:#fff}
  button.approve:hover{background:var(--pink-dark)}
  button.reject{background:#fff;color:var(--danger);border:1px solid var(--danger)}
  button.reject:hover{background:#fdecec}
  .empty{color:var(--grey);font-size:13.5px;padding:20px;text-align:center;background:#fff;border-radius:14px;border:1px dashed var(--line)}
  .log{font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--grey);display:flex;justify-content:space-between;gap:12px}
  .log b{color:var(--dark)}
  #loginWrap{max-width:340px;margin:80px auto;background:#fff;border-radius:16px;padding:28px;border:1px solid var(--line)}
  #loginWrap h1{font-size:18px;color:var(--pink-dark);margin-top:0}
  #loginWrap input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);margin-bottom:10px;font-size:14px}
  #loginWrap button{width:100%;padding:10px;border-radius:8px;border:none;background:var(--pink);color:#fff;font-weight:600;cursor:pointer}
  #loginErr{color:var(--danger);font-size:12.5px;min-height:16px}
  [hidden]{display:none !important}
  /* แท็บสลับหมวด — ลดความรกของหน้าเดิมที่โชว์ทุกส่วนพร้อมกันยาวเป็นหน้ากระดาษ */
  .tabs{display:flex;gap:6px;margin-bottom:24px;border-bottom:1px solid var(--line)}
  .tab{border:none;background:transparent;padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--grey);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.active{color:var(--pink-dark);border-bottom-color:var(--pink)}
  .tabpanel[hidden]{display:none}
  /* ตารางรายชื่อ Premium — แถวเดียวจบ เห็นชื่อ วันหมดอายุ ปุ่มยกเลิก ไม่ต้องเดา userId เอง */
  table.plist{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  table.plist th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--grey);padding:10px 14px;background:#faf5f8;border-bottom:1px solid var(--line)}
  table.plist td{padding:12px 14px;font-size:13.5px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.plist tr:last-child td{border-bottom:none}
  table.plist .name{font-weight:600;color:var(--dark)}
  table.plist .uid{font-size:11px;color:var(--grey);font-family:monospace}
  table.plist .soon{color:var(--warn);font-weight:600}
  .searchBox{margin-bottom:14px}
  .searchBox input{width:100%;max-width:320px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);font-size:13.5px}
  .lookup{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .lookup .row{display:flex;gap:8px}
  .lookup input{flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--line);font-size:14px}
  .lookup p{margin:10px 0 0;font-size:12.5px;color:var(--grey)}
</style>
</head>
<body>

<div id="loginWrap">
  <h1>เข้าสู่ระบบผู้ดูแล</h1>
  <input id="loginUser" placeholder="ชื่อผู้ใช้" autocomplete="username" />
  <input id="loginPass" type="password" placeholder="รหัสผ่าน" autocomplete="current-password" />
  <div id="loginErr"></div>
  <button id="loginBtn">เข้าสู่ระบบ</button>
</div>

<div id="app" hidden>
<header>
  <h1>ยายจันทร์ Premium <span class="badge">Admin</span></h1>
  <button id="logout">ออกจากระบบ</button>
</header>
<main>
  <div class="grid" id="overviewGrid"></div>

  <div class="tabs">
    <button class="tab active" data-tab="premium">รายชื่อ Premium</button>
    <button class="tab" data-tab="reviews">รอตรวจสอบ</button>
    <button class="tab" data-tab="logs">Audit Log</button>
  </div>

  <div class="tabpanel" id="panel-premium">
    <section>
      <h2>สมาชิก Premium <span class="count" id="premiumCount">0</span></h2>
      <div class="searchBox"><input id="premiumSearch" placeholder="ค้นหาชื่อ..." /></div>
      <div id="premiumList"></div>
    </section>
    <section>
      <h2>ค้นหา user โดยตรง</h2>
      <div class="lookup">
        <div class="row">
          <input id="cancelUserId" placeholder="LINE userId (เผื่อ user ที่ไม่ active หรือหา displayName ไม่เจอ)" />
          <button id="checkUserBtn" class="approve" style="background:var(--dark)">ตรวจสอบ</button>
        </div>
        <p id="cancelUserResult"></p>
      </div>
    </section>
  </div>

  <div class="tabpanel" id="panel-reviews" hidden>
    <section>
      <h2>รอตรวจสอบ (Pending Review) <span class="count" id="reviewCount">0</span></h2>
      <div id="reviews"></div>
    </section>
  </div>

  <div class="tabpanel" id="panel-logs" hidden>
    <section>
      <h2>Audit Log ล่าสุด</h2>
      <div id="logs"></div>
    </section>
  </div>
</main>
</div>

<script>
const $ = (sel) => document.querySelector(sel);
async function api(path, opt) {
  const r = await fetch('/admin' + path, { ...opt, headers: { 'content-type': 'application/json', ...opt?.headers } });
  if (r.status === 401) { showLogin(); throw new Error('unauthorized'); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'เกิดข้อผิดพลาด');
  return r.json();
}

function showLogin() { $('#loginWrap').hidden = false; $('#app').hidden = true; }
function showApp() { $('#loginWrap').hidden = true; $('#app').hidden = false; loadAll(); }

$('#loginBtn').onclick = async () => {
  $('#loginErr').textContent = '';
  try {
    await api('/login', { method: 'POST', body: JSON.stringify({ username: $('#loginUser').value, password: $('#loginPass').value }) });
    showApp();
  } catch (e) { $('#loginErr').textContent = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'; }
};
$('#logout').onclick = async () => { await api('/logout', { method: 'POST' }); showLogin(); };

// สลับแท็บ — เก็บ state แค่ใน DOM ไม่ต้องยุ่งกับ URL/router เพราะหน้านี้เล็ก ไม่จำเป็น
document.querySelectorAll('.tab').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
  document.querySelectorAll('.tabpanel').forEach(p => p.hidden = p.id !== `panel-${btn.dataset.tab}`);
});

function card(num, label, pink) { return `<div class="card ${pink ? 'pink' : ''}"><div class="num">${num}</div><div class="label">${label}</div></div>`; }

async function loadOverview() {
  const d = await api('/api/overview');
  $('#overviewGrid').innerHTML = [
    card(d.users.premiumActive, 'Premium Active', true),
    card(d.users.premiumNearExpiry, 'ใกล้หมดอายุ (≤3 วัน)'),
    card(d.users.premiumExpired, 'Premium หมดอายุ'),
    card(d.payments.waiting, 'รอชำระเงิน'),
    card(d.payments.pendingReview, 'รอตรวจสอบ (สลิป)', true),
    card(d.payments.verified, 'ยืนยันแล้ว'),
    card(d.payments.rejected, 'ถูกปฏิเสธ'),
    card(d.security.duplicateTransactions, 'พบธุรกรรมซ้ำ')
  ].join('');
}

let premiumUsers = [];
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function loadPremiumUsers() {
  const d = await api('/api/premium-users');
  premiumUsers = d.users;
  $('#premiumCount').textContent = premiumUsers.length;
  renderPremiumList(premiumUsers);
}

function renderPremiumList(list) {
  const el = $('#premiumList');
  if (!list.length) { el.innerHTML = '<div class="empty">ยังไม่มีสมาชิก Premium ตอนนี้</div>'; return; }
  const soon = Date.now() + 3 * 86_400_000;
  el.innerHTML = `<table class="plist"><thead><tr><th>ชื่อ LINE</th><th>เริ่มเมื่อ</th><th>หมดอายุ</th><th></th></tr></thead><tbody>
    ${list.map(u => `
      <tr data-uid="${esc(u.userId)}">
        <td><div class="name">${esc(u.displayName) || '(ไม่พบชื่อ — อาจบล็อกบอทไปแล้ว)'}</div><div class="uid">${esc(u.userId)}</div></td>
        <td>${esc(u.startedAt) || '-'}</td>
        <td>${esc(u.expiresAt) || '-'}</td>
        <td><button class="reject cancel-btn">ยกเลิก</button></td>
      </tr>`).join('')}
  </tbody></table>`;
  el.querySelectorAll('.cancel-btn').forEach(btn => {
    const tr = btn.closest('tr');
    const u = premiumUsers.find(x => x.userId === tr.dataset.uid);
    btn.onclick = () => cancelPremium(tr.dataset.uid, u?.displayName);
  });
}

$('#premiumSearch').oninput = (e) => {
  const q = e.target.value.trim().toLowerCase();
  renderPremiumList(!q ? premiumUsers : premiumUsers.filter(u => (u.displayName ?? '').toLowerCase().includes(q) || u.userId.toLowerCase().includes(q)));
};

async function cancelPremium(userId, displayName) {
  if (!confirm(`ยืนยันยกเลิก Premium ของ ${displayName || userId}?`)) return;
  try {
    await api(`/api/users/${encodeURIComponent(userId)}/cancel-premium`, { method: 'POST', body: JSON.stringify({ reason: 'admin_manual' }) });
    await Promise.all([loadOverview(), loadPremiumUsers()]);
  } catch (e) { alert(e.message); }
}

// เทียบชื่อแบบหยาบ ๆ พอให้เตือนแอดมิน ไม่ใช่การตัดสินขั้นสุดท้าย (แอดมินต้องดูเองเสมอ)
// ตัดคำนำหน้า/ช่องว่าง/ตัวพิมพ์เล็กใหญ่ออกก่อนเทียบ เพราะสลิปธนาคารมักมีคำนำหน้าที่ display name ของ LINE ไม่มี (เช่น "น.ส." "นาย")
function normalizeName(s) {
  return String(s ?? '')
    .replace(/^(นาย|นาง|นางสาว|น\.ส\.|ด\.ช\.|ด\.ญ\.|mr\.?|mrs\.?|ms\.?|miss)\s*/i, '')
    .replace(/\s+/g, '')
    .toLowerCase();
}
function namesLikelyMatch(a, b) {
  if (!a || !b) return null; // ไม่มีข้อมูลพอจะเทียบ (เช่น อ่านสลิปไม่ได้ หรือดึงชื่อ LINE ไม่ได้) — แสดงเป็น "ตรวจสอบเองด้วย" ไม่ใช่ mismatch แดง
  const na = normalizeName(a), nb = normalizeName(b);
  if (!na || !nb) return null;
  return na === nb || na.includes(nb) || nb.includes(na); // includes กันเคสชื่อเล่น/ชื่อเต็มไม่ตรงเป๊ะแต่เป็นคนเดียวกัน (ผ่อนปรนไว้ก่อน ให้แอดมินตัดสินใจสุดท้าย)
}

function renderNameCheck(r) {
  const accountName = r.accountDisplayName;
  const senderName = r.ocrExtracted?.senderName;
  const receiverName = r.ocrExtracted?.receiverName;
  const slipImage = r.ocrExtracted?.slipImageBase64;
  const match = namesLikelyMatch(accountName, senderName);
  const cls = match === false ? 'namecheck mismatch' : 'namecheck';
  const flagHtml = match === false
    ? `<div class="flag">⚠ ชื่อบัญชีกับชื่อผู้โอนดูไม่ตรงกัน — ตรวจสอบก่อนอนุมัติ</div>`
    : match === true
      ? `<div class="ok">✓ ชื่อตรงกับบัญชีที่สมัคร</div>`
      : `<div style="color:var(--grey);font-size:12px;margin-top:4px">อ่านชื่อได้ไม่ครบ กรุณาตรวจสอบด้วยตาจากรูปสลิปด้านล่าง</div>`;
  // รูปสลิปที่แนบมาด้วยเสมอ (ถ้าย่อขนาดสำเร็จ) ให้แอดมินดูเองเป็น fallback เวลา AI อ่านชื่อผิด/อ่านไม่ได้เลย
  // ไม่ใช่แค่โชว์ตอนอ่านชื่อไม่ได้เท่านั้น เพราะ AI อ่านผิดแบบเงียบ ๆ (เช่นสลับชื่อผู้โอน-ผู้รับ) ก็เป็นไปได้เหมือนกัน
  const slipImageHtml = slipImage
    ? `<div style="margin-top:10px">
        <div style="font-size:11px;color:var(--grey);margin-bottom:4px">รูปสลิปที่ส่งมา (ย่อขนาดแล้ว)</div>
        <a href="${slipImage}" target="_blank" rel="noopener"><img src="${slipImage}" alt="รูปสลิป" style="max-width:220px;max-height:220px;border-radius:8px;border:1px solid var(--line);display:block"></a>
      </div>`
    : `<div style="font-size:11.5px;color:var(--grey);margin-top:8px">ไม่มีรูปสลิปแนบมา (อาจเป็นรายการเก่าก่อนเพิ่มฟีเจอร์นี้ หรือย่อขนาดไม่สำเร็จ)</div>`;
  return `<div class="${cls}">
    <div class="row"><span>ชื่อบัญชีที่สมัคร (LINE)</span><b>${esc(accountName) || '(ดึงชื่อไม่ได้)'}</b></div>
    <div class="row"><span>ชื่อผู้โอน (อ่านจากสลิป)</span><b>${esc(senderName) || '(อ่านไม่ได้)'}</b></div>
    <div class="row"><span>ชื่อผู้รับ (อ่านจากสลิป)</span><b>${esc(receiverName) || '(อ่านไม่ได้)'}</b></div>
    ${flagHtml}
    ${slipImageHtml}
  </div>`;
}

async function loadReviews() {
  const d = await api('/api/reviews');
  $('#reviewCount').textContent = d.reviews.length;
  const el = $('#reviews');
  if (!d.reviews.length) { el.innerHTML = '<div class="empty">ไม่มีรายการรอตรวจสอบ 🎉</div>'; return; }
  el.innerHTML = d.reviews.map(r => `
    <div class="review" data-ref="${r.transactionReference}">
      <div style="flex:1;min-width:240px">
        <div class="ref">Ref: ${r.transactionReference}</div>
        <div class="meta">
          จำนวนที่อ่านได้: <span class="amount">${r.amount ?? '-'} บาท</span><br/>
          เลขอ้างอิงในสลิป: ${esc(r.ocrExtracted?.transactionReference) || '-'}<br/>
          เวลาที่โอนตามสลิป: ${esc(r.ocrExtracted?.paidAt) || '-'}<br/>
          เหตุผลที่ต้องตรวจสอบ: ${esc(r.reviewReason) || '-'}<br/>
          ส่งเมื่อ: ${r.createdAt ?? '-'}
        </div>
        ${renderNameCheck(r)}
      </div>
      <div class="actions">
        <button class="approve">อนุมัติ</button>
        <button class="reject">ปฏิเสธ</button>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.review').forEach(row => {
    const ref = row.dataset.ref;
    row.querySelector('.approve').onclick = () => act(ref, 'approve');
    row.querySelector('.reject').onclick = () => act(ref, 'reject');
  });
}

async function act(ref, action) {
  if (action === 'reject' && !confirm('ยืนยันปฏิเสธรายการนี้?')) return;
  try {
    await api(`/api/reviews/${encodeURIComponent(ref)}/${action}`, { method: 'POST', body: action === 'reject' ? JSON.stringify({ reason: 'admin_manual' }) : undefined });
    await loadAll();
  } catch (e) { alert(e.message); }
}

$('#checkUserBtn').onclick = async () => {
  const userId = $('#cancelUserId').value.trim();
  const out = $('#cancelUserResult');
  if (!userId) { out.textContent = 'กรุณากรอก userId'; return; }
  out.textContent = 'กำลังตรวจสอบ...';
  try {
    const d = await api(`/api/users/${encodeURIComponent(userId)}`);
    out.innerHTML = d.active
      ? `<b style="color:var(--pink-dark)">Premium Active</b> · หมดอายุ ${d.expiresAt ?? '-'} · <a href="#" id="cancelFromLookup" style="color:var(--danger)">ยกเลิก Premium นี้</a>`
      : `ไม่ใช่ Premium (สถานะ: ${d.plan})`;
    const link = $('#cancelFromLookup');
    if (link) link.onclick = async (e) => { e.preventDefault(); await cancelPremium(userId); out.textContent = 'ยกเลิก Premium สำเร็จ'; };
  } catch (e) { out.textContent = e.message; }
};

async function loadLogs() {
  const d = await api('/api/audit-logs?limit=50');
  $('#logs').innerHTML = d.logs.map(l => `<div class="log"><span><b>${l.eventType}</b> ${l.userId ? '· ' + l.userId : ''} ${l.transactionReference ? '· ' + l.transactionReference : ''}</span><span>${l.createdAt ?? ''}</span></div>`).join('') || '<div class="empty">ยังไม่มีบันทึก</div>';
}

async function loadAll() {
  try { await Promise.all([loadOverview(), loadPremiumUsers(), loadReviews(), loadLogs()]); }
  catch (e) { if (e.message !== 'unauthorized') console.error(e); }
}

// เช็คว่ามี session อยู่แล้วหรือไม่ (ลองเรียก overview ตรง ๆ)
api('/api/overview').then(showApp).catch(showLogin);
</script>
</body>
</html>
